<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-label="Sahil Chand cybersecurity portfolio banner">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".55" stop-color="#071f33"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#42e8a3" stop-opacity=".32"/><stop offset="1" stop-color="#42e8a3" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7dd3fc" stroke-opacity=".08"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1400" height="360" rx="30" fill="url(#bg)"/>
<rect width="1400" height="360" rx="30" fill="url(#grid)"/>
<circle cx="190" cy="80" r="150" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="190;310;190" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="1190" cy="300" r="180" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cy" values="300;210;300" dur="9s" repeatCount="indefinite"/></circle>
<g fill="none" stroke="#42e8a3" stroke-opacity=".45"><path d="M70 290H1330"/><path d="M70 305H1330" stroke-opacity=".15"/></g>
<g fill="#7dd3fc" opacity=".65"><circle cx="105" cy="105" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="1280" cy="90" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle><circle cx="1210" cy="145" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle></g>
<text x="700" y="145" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" letter-spacing="10">SAHIL CHAND</text>
<text x="700" y="190" text-anchor="middle" fill="#42e8a3" font-family="monospace" font-size="21" font-weight="700" letter-spacing="3">CYBERSECURITY • AI • SECURITY AUTOMATION</text>
<text x="700" y="235" text-anchor="middle" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="16">BUILD  •  DETECT  •  DEFEND  •  AUTOMATE</text>
<g stroke="#42e8a3" stroke-width="3" stroke-linecap="round"><path d="M500 270h70"><animate attributeName="x1" values="500;525;500" dur="2s" repeatCount="indefinite"/><animate attributeName="x2" values="570;595;570" dur="2s" repeatCount="indefinite"/></path><path d="M830 270h70"><animate attributeName="x1" values="830;805;830" dur="2s" repeatCount="indefinite"/><animate attributeName="x2" values="900;875;900" dur="2s" repeatCount="indefinite"/></path></g>
</svg>